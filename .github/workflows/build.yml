name: Build BacNafa APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # ANCIEN: Setup Java 17
      # uses: actions/setup-java@v4
      # with:
      #   distribution: 'zulu'
      #   java-version: '17'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDKs
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      # ANCIEN Configure Android (patch minSdk uniquement)
      # run: |
      #   sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
      #   echo "android.builder.sdkDownload=false" >> android/gradle.properties
      #   echo "android.nonTransitiveRClass=false" >> android/gradle.properties
      - name: Configure Android
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts

          echo "android.builder.sdkDownload=false" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

          # NOUVEAU: Génère un keystore de debug local pour signer sans secret
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/debug.keystore \
            -storetype PKCS12 -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt || true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      # ANCIEN: Build APK (ARM64) sans signature intégrée
      # run: flutter build apk --release --target-platform android-arm64
      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64

      # ANCIEN: Restore keystore from secret
      # run: |
      #   mkdir -p keystore
      #   echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      # env:
      #   KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Restore keystore from secret (REMPLACE - plus de secret requis)
        run: |
          # Utilisation du keystore de debug généré localement au lieu d'un secret
          echo "Keystore de debug généré localement - aucun secret GitHub requis"
          ls -la android/app/debug.keystore || echo "Keystore non trouvé, utilisation build non signé"

      # ANCIEN: Sign and align APK (dépendait de secrets KEYSTORE_PASS, KEY_PASS, KEY_ALIAS)
      # run: |
      #   BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
      #   export PATH=$PATH:$BUILD_TOOLS_DIR
      #   APK_RAW=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" -type f | head -n 1)
      #   zipalign -v 4 "$APK_RAW" aligned.apk
      #   apksigner sign --ks keystore/release.keystore \
      #     --ks-pass pass:${KEYSTORE_PASS} --key-pass pass:${KEY_PASS} \
      #     --ks-key-alias "${KEY_ALIAS}" --out "BacNafa-v${GITHUB_RUN_NUMBER}.apk" aligned.apk
      #   apksigner verify "BacNafa-v${GITHUB_RUN_NUMBER}.apk"
      # env:
      #   KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      #   KEY_PASS: ${{ secrets.KEY_PASS }}
      #   KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Sign and align APK
        run: |
          # NOUVEAU: signe avec le keystore de debug local (pas de secret)
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          export PATH=$PATH:$BUILD_TOOLS_DIR

          APK_RAW=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "APK non trouvé, tentative avec debug.keystore via gradle"
            # Fallback: rebuild avec signature debug explicite
            flutter build apk --release --target-platform android-arm64 \
              --build-name=1.0.0 --build-number=${GITHUB_RUN_NUMBER}
            APK_RAW=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" -type f | head -n 1)
          fi

          zipalign -v 4 "$APK_RAW" aligned.apk
          apksigner sign --ks android/app/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "BacNafa-v${GITHUB_RUN_NUMBER}.apk" aligned.apk
          apksigner verify "BacNafa-v${GITHUB_RUN_NUMBER}.apk"
        env:
          # NOUVEAU: pas de secrets KEYSTORE_*, utilisation mot de passe fixe debug
          KEYSTORE_PASS: android
          KEY_PASS: android
          KEY_ALIAS: androiddebugkey

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BacNafa-ARM64
          path: BacNafa-v${{ github.run_number }}.apk
          if-no-files-found: error
