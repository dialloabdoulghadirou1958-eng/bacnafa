name: Build BacNafa APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDKs
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Android
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts

          echo "android.builder.sdkDownload=false" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Sign and align APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          export PATH=$PATH:$BUILD_TOOLS_DIR

          keytool -genkey -v -keystore debug.keystore \
            -storepass:env KEYSTORE_PASS -alias androiddebugkey \
            -keypass:env KEYSTORE_PASS -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        env:
          KEYSTORE_PASS: android

      - name: Sign and align APK (suite)
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          export PATH=$PATH:$BUILD_TOOLS_DIR

          APK_RAW=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" -type f | head -n 1)
          zipalign -v 4 "$APK_RAW" aligned.apk
          apksigner sign --ks debug.keystore \
            --ks-pass pass:${KEYSTORE_PASS} --key-pass pass:${KEYSTORE_PASS} \
            --out "BacNafa-v${GITHUB_RUN_NUMBER}.apk" aligned.apk
          apksigner verify "BacNafa-v${GITHUB_RUN_NUMBER}.apk"
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BacNafa-ARM64
          path: BacNafa-v${{ github.run_number }}.apk
          if-no-files-found: error